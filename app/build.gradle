plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}

android {
namespace 'com.freenet50gb.app'
compileSdk 35

defaultConfig {
    applicationId 'com.freenet50gb.app'
    minSdk 23
    targetSdk 35
    versionCode 1
    versionName '1.0'
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
    jvmTarget = '17'
}

}
